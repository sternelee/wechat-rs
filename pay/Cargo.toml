[package]
authors = ["sternelee"]
edition = "2021"
name = "wechat_pay"
version = "0.2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wechat_sdk = {path = "../sdk", version = "0.2.0", features = ["axum"]}
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.79"
serde-xml-rs = "0.5.1"
itertools= "0.10.3"
md5= "0.7.0"
chrono = "0.4.19"
openssl = "0.10.38"
base64 = "0.13.0"
hmac = "0.12.1"
sha2 = "0.10.2"
percent-encoding = "2.1.0"
lazy_static = "1.4.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
