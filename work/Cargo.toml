[package]
name = "wechat_work"
version = "0.2.0"
authors = ["sternelee"]
keywords = ["wechat", "企业微信"]
edition = "2021"

[dependencies]
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.79"
lazy_static = "1.4.0"
wechat_sdk = { path = "../sdk", version = "0.2.0", features = ["axum"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
